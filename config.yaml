# Configurazione di default di sitechecker.
# Per uso personale copia questo file in .config.local.yaml (ignorato da git) e lancia:
#   python sitechecker.py -c .config.local.yaml
# Le chiavi omesse assumono il valore di default indicato qui.

# Siti da controllare (lo schema https:// e' opzionale).
# Ogni voce e' un URL oppure una mappa con controlli specifici del sito:
#   - url: https://www.example.com
#     expect_host: example.com        # host finale atteso dopo i redirect (www. ignorato)
#     expect_text: ["Contatti"]       # testi che devono comparire (senza maiuscole); FAIL se assenti
#     forbid_text: ["Welcome to nginx", "Account suspended"]   # testi che non devono comparire
urls:
  - https://www.matteopelucco.com

# Opzionale: file con un URL per riga (# per commenti), in aggiunta a `urls`
urls_file: null

# Check con browser reale (desktop + mobile, richiede: playwright install chromium)
browser: false

# Controlli HTTP
links: 10             # link interni da campionare (0 = nessuno)
max_resources: 40     # risorse (img/css/js) da verificare per pagina
timeout: 15           # secondi
retries: 2            # ritentativi sugli errori di rete transitori (non su timeout ed errori HTTP)
retry_wait: 1.0       # secondi di attesa tra i tentativi
samples: 3            # misure del tempo di risposta: si usa la mediana
slow_ms: 3000         # oltre questa soglia la pagina e' "lenta"
tls_warn_days: 21     # avviso se il certificato scade entro N giorni
insecure: false       # ignora errori TLS (sconsigliato)

# Esplorazione e giudizio sulle pagine (solo con browser: true)
explore_pages: 3      # pagine interne da visitare oltre alla prima, scelte tra sezioni diverse (0 = solo la prima)
explore_exclude:      # link da non visitare (regex)
  - 'logout|signout|esci\b'
  - '\.(pdf|zip|docx?|xlsx?|pptx?|jpe?g|png|gif|svg|mp[34])(\?|$)'
min_words: 40         # sotto questa soglia la pagina e' "poco informativa" (WARN)

# Parallelismo
concurrency: 10
browser_concurrency: 3

# Output
shots: screenshots    # cartella degli screenshot (solo con browser: true)
html: null            # es. report.html
json: null            # es. report.json

# Log
verbose: 0            # 0 = silenzioso, 1 = passi principali, 2 = dettaglio
log_file: null        # es. sitecheck.log (log completo, livello DEBUG)

# Errori JS del browser da ignorare (espressioni regolari)
ignore_js_errors:
  - '^Failed to load resource'
  - 'requestStorageAccess'

# Richieste fallite del browser da ignorare (regex su "url (motivo)"): beacon di analytics interrotti alla chiusura pagina
ignore_failed_requests:
  - 'google-analytics\.com'
  - 'googletagmanager\.com'
  - 'doubleclick\.net'
  - 'facebook\.com/tr'

# Monitoraggio continuo (tutto opzionale)
interval: 0           # secondi tra un giro e l'altro: > 0 = resta in esecuzione e ripete i controlli fino a Ctrl+C (0 = una volta)
history: null         # es. history.jsonl: storico delle esecuzioni; stampa i cambi di stato e i peggioramenti dei tempi
history_keep: 30      # esecuzioni conservate
confirm_wait: 0       # secondi; se > 0 i siti in FAIL vengono ricontrollati dopo l'attesa (esclude i FAIL transitori)
notify_webhook: null  # webhook Slack/Teams/compatibile (POST {"text": ...})
notify_on: change     # change = solo cambi di stato che coinvolgono un FAIL (richiede `history`); fail = a ogni FAIL
heartbeat_url: null   # GET a fine esecuzione (es. healthchecks.io): se non arriva, e' il monitor a non girare
